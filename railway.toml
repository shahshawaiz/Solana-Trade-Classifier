# Railway deployment — permanent always-on container.
# Runs the full app (Express API + built Vite UI + 5-min trading daemons) as one
# long-lived process, with the `jup` CLI available for REAL on-chain perps execution.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npm run start:railway"
# Keep the runtime permanent: auto-restart if the process ever exits.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
